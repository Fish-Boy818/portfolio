global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: business-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:8081
          - 127.0.0.1:8082
        labels:
          service: business-service

  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: redis-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9121
